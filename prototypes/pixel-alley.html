<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The alley — arms deal</title>
<style>
/* =========================================================================
   PIXEL ALLEY — one cinematic scene. Disposable. Nothing in src/ is touched.

   WHY THIS FILE IS DIFFERENT FROM THE OTHER SHEETS

   Every other prototype on this branch is hand-authored rows of palette keys.
   That technique cannot carry what this scene needs — dithered light ramps,
   contact shadows, ambient occlusion, atmospheric falloff — so this one is
   drawn procedurally into a 320 x 200 ImageData buffer and blitted to a
   canvas at an integer scale with smoothing off.

   The drawing code IS the source. There is no image file.

   PIXEL SCALE, STATED HONESTLY

   The cast sheet is 32 x 40 because it was drawn for a panel. Foreground
   characters here are ~140px tall because this is a close third-person
   camera. Those two scales cannot both be right in one image and this file
   does not pretend otherwise: these figures are drawn at scene scale, in the
   same palette family, and are not the cast sprites enlarged.

   LIGHT

   One key: low warm sun from the upper left, which is where the reference
   puts it. Everything follows from that — the left plane of every object is
   the lit plane, shadows fall down and right, the trunk interior is two full
   steps darker than the sunlit deck around it, and the only cool light in the
   frame is weak sky fill in the shadows.

   DEPTH, in the order the eye is meant to read it
     FOREGROUND  two figures, darkest masses, cut by the frame, rim-lit
     VEHICLE     maroon, sunlit deck, black interior, contents
     BACKGROUND  dumpster, bins, railing, far street — hazed and desaturated
   ========================================================================= */
html, body { margin:0; height:100%; background:#0b0a09; }
body { display:flex; align-items:center; justify-content:center; }
#wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
canvas {
  image-rendering: pixelated; image-rendering: crisp-edges;
  display:block; box-shadow:0 0 0 1px #2a231c;
}
figcaption {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
  font-size:11px; color:#6b6157; letter-spacing:.04em;
}
</style>
</head>
<body>
<figure id="wrap" style="margin:0">
  <canvas id="c"></canvas>
  <figcaption>320 &times; 200 &middot; drawn in code &middot; integer scale, no smoothing</figcaption>
</figure>
<script>
const W = 320, H = 200;
const img = new Uint8ClampedArray(W * H * 4);

/* ------------------------------------------------------------- palette ---
   A gritty urban set. Every entry is a ramp dark→light so surfaces can be
   shaded by index rather than by inventing colours at draw time. */
const hx = (s) => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
const R = (...s) => s.map(hx);

const P = {
  // sky, haze, far street
  haze:   R('#6d6455','#7e7462','#8e8371'),
  road:   R('#2a2724','#37332e','#454038'),
  // concrete pavement, sunlit → shadowed
  conc:   R('#2e2b26','#3d3931','#4e483d','#605949','#746b57','#8a7f66','#9e9276'),
  // right-hand building, close and in shade
  wall:   R('#1b0f0e','#281713','#361f19','#452921','#553229','#663d31'),
  // the car
  car:    R('#150708','#240c0e','#360f10','#4a1618','#5f1f1e','#762b25','#8f3a2d','#a94f3a'),
  chrome: R('#2b2b30','#45454c','#63636b','#87878f','#adadb5','#d2d2d8'),
  lin:    R('#0c0d10','#131519','#1b1e23','#25292f','#31363e'),  // trunk lining
  // materials in the trunk
  gun:    R('#0c0e11','#161a1f','#232931','#323a44','#464f5b','#5e6875','#7c8794'),
  wood:   R('#1e1108','#2f1c0d','#452a15','#5c3a1f','#78522d','#94693c'),
  grn:    R('#111609','#1b2410','#28331a','#374527','#495a35','#5d7045'),
  navy:   R('#0b0f14','#141a22','#1e2833','#2a3644','#384756'),
  plast:  R('#2a2c2e','#3d4042','#565a5d','#71767a','#8d9398'),   // hard case
  red:    R('#3a0d0a','#5c1611','#84231a','#a83124','#c8452f'),
  brass:  R('#3d2f10','#61491a','#8a6a24','#b28f34','#d4b558'),
  // people
  jkA:    R('#20120a','#331d0e','#4a2c14','#67401d','#87552a','#a86e3a'),  // tan leather
  jkB:    R('#150e09','#221710','#312216','#432f1e','#573f28','#6d5134'),  // dark brown
  sknA:   R('#2d1b13','#43281b','#5c3a27','#7a5034'),
  sknB:   R('#4a3122','#65442f','#845b40','#a17552'),
  hair:   R('#0a0807','#130f0c','#1d1712','#2a2119'),
  denim:  R('#151a20','#1f272f','#2c3641','#3a4854'),
  // props
  dump:   R('#0e1a1f','#16272e','#20353f','#2b4752','#375a67','#456e7c'),
  bin:    R('#1a1c1e','#26292c','#34383c','#45494e','#585d63'),
  cap:    R('#121409','#1a1d12','#24281a','#2f3423','#3b402c'),
  sun:    R('#a8763c','#c9964f','#e2b66c','#f5d894'),
  black:  R('#060607','#0b0b0c','#101113'),
};

/* --------------------------------------------------------------- tools --- */
const BAYER = [
  [ 0, 8, 2,10],[12, 4,14, 6],[ 3,11, 1, 9],[15, 7,13, 5]
];
const thr = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;

let seed = 0x9e3779b9;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) % 100000) / 100000; }
function reseed(s) { seed = s >>> 0 || 1; }

function put(x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H || !c) return;
  const i = (y * W + x) * 4;
  img[i] = c[0]; img[i+1] = c[1]; img[i+2] = c[2]; img[i+3] = 255;
}
function get(x, y) {
  const i = (y * W + x) * 4;
  return [img[i], img[i+1], img[i+2]];
}
function rect(x0, y0, x1, y1, c) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(x, y, c);
}
/* A dithered pick along a ramp. t is 0..1 across the ramp; the Bayer matrix
   breaks the step so a gradient reads as texture instead of banding. */
function ramp(x, y, cols, t) {
  t = Math.max(0, Math.min(0.9999, t)) * (cols.length - 1);
  const i = Math.floor(t);
  return (t - i) > thr(x, y) ? cols[Math.min(i + 1, cols.length - 1)] : cols[i];
}
/* Fill a trapezoid row by row — the only primitive that makes a boot look
   like a box instead of a rectangle. */
function quad(yT, yB, lT, rT, lB, rB, fn) {
  for (let y = yT; y <= yB; y++) {
    const v = (y - yT) / Math.max(1, yB - yT);
    const l = Math.round(lT + (lB - lT) * v), r = Math.round(rT + (rB - rT) * v);
    for (let x = l; x <= r; x++) {
      const u = (x - l) / Math.max(1, r - l);
      const c = fn(x, y, u, v);
      if (c) put(x, y, c);
    }
  }
}
/* Multiply what is already there. Used for cast shadow and occlusion, so a
   shadow darkens whatever it lands on rather than painting one flat colour. */
function mul(x0, y0, x1, y1, f, mask) {
  for (let y = Math.max(0, y0); y <= Math.min(H - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++) {
      if (mask && !mask(x, y)) continue;
      const c = get(x, y);
      put(x, y, [c[0] * f, c[1] * f, c[2] * f]);
    }
}
/* Contact shadow: hard directly under the object, dithering out along the
   sun direction. Nothing sits on the ground without one. */
function contact(cx, cy, rx, ry, strength) {
  for (let y = cy - ry; y <= cy + ry; y++)
    for (let x = cx - rx; x <= cx + rx; x++) {
      const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
      if (d > 1) continue;
      const f = 1 - (1 - strength) * (1 - d);
      if ((1 - d) > thr(x, y) * 0.9) {
        const c = get(x, y);
        put(x, y, [c[0] * f, c[1] * f, c[2] * f]);
      }
    }
}
function speck(x0, y0, x1, y1, p, cols) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
    if (rnd() < p) put(x, y, cols[(rnd() * cols.length) | 0]);
}
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

/* ======================================================================
   1. FAR STREET  — hazed, desaturated, low contrast. Everything here is
   pulled toward the haze colour so the eye reads it as distance.
   ====================================================================== */
reseed(7);
rect(0, 0, W - 1, 15, P.road[1]);
for (let y = 0; y <= 15; y++)
  for (let x = 0; x < W; x++) put(x, y, ramp(x, y, P.road, 0.25 + y / 40));
// distant vehicles, two of them, barely resolved
function farCar(x0, x1, top, body, roof) {
  quad(top + 4, top + 11, x0, x1, x0 - 1, x1 + 1, (x, y, u, v) => mix(body, P.haze[0], 0.45 - v * 0.1));
  quad(top, top + 4, x0 + 8, x1 - 8, x0 + 4, x1 - 4, (x, y) => mix(roof, P.haze[0], 0.5));
  mul(x0 - 2, top + 11, x1 + 2, top + 13, 0.72);
}
farCar(52, 104, 1, hx('#7c7f86'), hx('#9aa0a8'));
rect(58, 1, 66, 3, mix(hx('#c2352b'), P.haze[1], 0.35));   // a light bar, off
rect(84, 1, 92, 3, mix(hx('#4a6f7a'), P.haze[1], 0.35));
farCar(214, 292, 0, hx('#6a6255'), hx('#7d7466'));
rect(236, 0, 288, 6, mix(hx('#57503f'), P.haze[1], 0.4));  // a box body

// kerb
for (let x = 0; x < W; x++) {
  put(x, 16, ramp(x, 16, P.conc, 0.78));
  put(x, 17, ramp(x, 17, P.conc, 0.30));
  put(x, 18, P.conc[1]);
}

/* ======================================================================
   2. PAVEMENT — the ground plane. Lighter and warmer toward the middle
   distance where the sun lands, falling off to the near foreground.
   ====================================================================== */
reseed(1337);
for (let y = 19; y < H; y++) {
  const v = (y - 19) / (H - 19);
  for (let x = 0; x < W; x++) {
    const acrossLight = 0.10 * (1 - x / W);          // sun from the left
    let t = 0.78 - v * 0.42 + acrossLight;
    put(x, y, ramp(x, y, P.conc, t));
  }
}
// slabs and cracks
for (let y = 26; y < H; y += 17) {
  const jitter = ((y * 37) % 5) - 2;
  for (let x = 0; x < W; x++) if ((x + jitter) % 3 !== 0) put(x, y, ramp(x, y, P.conc, 0.30));
}
for (let x = 24; x < W; x += 46) {
  for (let y = 19; y < H; y++) {
    const wob = Math.round(Math.sin(y * 0.21 + x) * 1.6);
    if ((y + x) % 4 !== 0) put(x + wob, y, ramp(x, y, P.conc, 0.28));
  }
}
// dirt, stains, debris — environmental storytelling, kept quiet
speck(19, 20, W - 1, H - 1, 0.020, [P.conc[2], P.conc[3], P.conc[1]]);
function stain(cx, cy, rx, ry, f) {
  for (let y = cy - ry; y <= cy + ry; y++) for (let x = cx - rx; x <= cx + rx; x++) {
    const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
    if (d < 1 && (1 - d) > thr(x, y) * 0.8) { const c = get(x, y); put(x, y, [c[0]*f, c[1]*f, c[2]*f]); }
  }
}
stain(66, 96, 26, 9, 0.86); stain(196, 64, 20, 7, 0.88);
stain(262, 150, 30, 12, 0.84); stain(120, 178, 34, 10, 0.9);
reseed(88);
for (let i = 0; i < 26; i++) {                      // litter
  const x = 20 + (rnd() * 280) | 0, y = 30 + (rnd() * 160) | 0;
  const c = rnd() < 0.5 ? P.conc[6] : P.wood[3];
  put(x, y, c); if (rnd() < 0.5) put(x + 1, y, c);
  put(x, y + 1, [c[0]*0.5, c[1]*0.5, c[2]*0.5]);
}

/* ======================================================================
   3. BACKGROUND PROPS
   ====================================================================== */
// --- railing, far left, in front of a drop
(function railing() {
  const yTop = 6, yBot = 30;
  rect(0, yTop, 96, yTop + 1, P.bin[3]);
  rect(0, yTop + 2, 96, yTop + 3, P.bin[1]);
  for (let x = 2; x < 96; x += 7) {
    for (let y = yTop; y < yBot; y++) put(x, y, ramp(x, y, P.bin, 0.55 - (y - yTop) / 60));
    put(x + 1, yTop, P.bin[4]);
  }
  rect(0, yBot, 96, yBot + 1, P.bin[0]);
  mul(0, yBot + 2, 100, yBot + 7, 0.82);
})();

// --- dumpster, the big background mass on the left
(function dumpster() {
  const x0 = 30, x1 = 128, yTop = 20, yBot = 78;
  contact(80, yBot + 3, 54, 7, 0.5);
  // body, sides sloping in toward the top (looking slightly down on it)
  quad(yTop + 8, yBot, x0 + 6, x1 - 6, x0, x1, (x, y, u, v) =>
    ramp(x, y, P.dump, 0.62 - v * 0.30 - u * 0.16));
  // lid
  quad(yTop, yTop + 8, x0 + 14, x1 - 14, x0 + 5, x1 - 5, (x, y, u, v) =>
    ramp(x, y, P.dump, 0.86 - v * 0.18 - u * 0.12));
  rect(x0 + 5, yTop + 8, x1 - 5, yTop + 9, P.dump[0]);
  // ribs
  for (let x = x0 + 12; x < x1 - 10; x += 13)
    for (let y = yTop + 11; y < yBot; y++) put(x, y, ramp(x, y, P.dump, 0.30));
  // rust and scuff
  reseed(21);
  speck(x0 + 4, yTop + 10, x1 - 4, yBot - 2, 0.05, [P.wood[2], P.dump[1], P.dump[0]]);
  rect(x0 + 22, yTop + 26, x0 + 46, yTop + 33, mix(P.wood[3], P.dump[2], 0.4));  // a tag
  // feet
  rect(x0 + 6, yBot, x0 + 12, yBot + 4, P.black[1]);
  rect(x1 - 12, yBot, x1 - 6, yBot + 4, P.black[1]);
  mul(x0, yTop, x1, yBot + 4, 0.86);                  // sits back in the haze
  for (let y = yTop; y <= yBot + 4; y++) for (let x = x0; x <= x1; x++) {
    const c = get(x, y), g = (c[0] + c[1] + c[2]) / 3;
    put(x, y, mix(c, [g, g, g], 0.28));               // and desaturate it
  }
})();

// --- two bins
(function bins() {
  function can(cx, top, h, w) {
    contact(cx, top + h + 2, w - 2, 4, 0.55);
    quad(top + 3, top + h, cx - w + 2, cx + w - 2, cx - w, cx + w, (x, y, u, v) =>
      ramp(x, y, P.bin, 0.66 - u * 0.34 - v * 0.10));
    quad(top, top + 3, cx - w + 3, cx + w - 3, cx - w + 2, cx + w - 2, (x, y, u) =>
      ramp(x, y, P.bin, 0.80 - u * 0.2));
    for (let y = top + 6; y < top + h; y += 5) rect(cx - w + 1, y, cx + w - 1, y, P.bin[1]);
  }
  can(150, 28, 34, 11);
  can(178, 33, 28, 9);
})();

/* ======================================================================
   4. THE RIGHT-HAND BUILDING — close, in shade, and the darkest large mass
   in frame apart from the trunk. It exists to close the composition.
   ====================================================================== */
(function building() {
  const x0 = 256;
  quad(0, H - 1, x0 + 6, W - 1, x0 - 10, W - 1, (x, y, u, v) =>
    ramp(x, y, P.wall, 0.30 + u * 0.42 - v * 0.10));
  // brick courses, following the slight lean
  for (let y = 3; y < H; y += 4) {
    const l = Math.round(x0 + 6 + (x0 - 10 - (x0 + 6)) * (y / H));
    for (let x = l; x < W; x++) if ((x + (y & 4)) % 9 !== 0) put(x, y, ramp(x, y, P.wall, 0.16 + (x - l) / 90));
  }
  // downpipe
  for (let y = 0; y < H; y++) {
    const l = Math.round(x0 + 10 + (x0 - 6 - (x0 + 10)) * (y / H));
    put(l, y, P.bin[2]); put(l + 1, y, P.bin[3]); put(l + 2, y, P.bin[0]);
  }
  // a grated vent, and weathering below it
  rect(288, 40, 312, 62, P.black[1]);
  for (let y = 42; y < 62; y += 3) rect(290, y, 310, y, P.bin[1]);
  for (let y = 63; y < 120; y++) mul(290, y, 310, y, 0.93 + (y - 63) / 900);
  reseed(404);
  speck(x0 - 8, 0, W - 1, H - 1, 0.03, [P.wall[0], P.wall[4], P.wall[1]]);
  // the wall throws its shade left onto the pavement
  quad(120, H - 1, 246, 262, 214, 300, (x, y) => { const c = get(x, y); return [c[0]*0.80, c[1]*0.80, c[2]*0.82]; });
})();

/* ======================================================================
   5. THE CAR — an old sedan, rear on, boot up.

   Built as real parts: bumper, rear panel with lamps and plate, deck,
   aperture rim, interior box, lid underside, hinge arms. The interior is a
   trapezoid box with a far wall and two side walls, which is the difference
   between a boot and a black rectangle.
   ====================================================================== */
const CAR = {
  bodyL: 80, bodyR: 252,           // rear face
  deckY: 146,                      // near lip of the boot
  panelY: 156, bumperY: 176, groundY: 188,
  apFarY: 88, apFarL: 104, apFarR: 228,     // aperture, far edge
  apNearY: 146, apNearL: 88, apNearR: 244,  // aperture, near edge
  flrFarY: 104, flrFarL: 112, flrFarR: 220,
  flrNearY: 146, flrNearL: 96, flrNearR: 236,
  lidTopY: 30, lidBotY: 86, lidTopL: 96, lidTopR: 236, lidBotL: 88, lidBotR: 244,
};

// --- the car's own shadow on the ground, thrown down and right
contact(178, 190, 104, 12, 0.42);
quad(180, 198, 244, 268, 236, 292, (x, y) => { const c = get(x, y); return [c[0]*0.62, c[1]*0.62, c[2]*0.66]; });

// --- rear quarters: body sides sweeping away from the camera
quad(CAR.deckY - 4, CAR.groundY, CAR.bodyL, CAR.bodyR, CAR.bodyL - 4, CAR.bodyR + 4,
  (x, y, u, v) => ramp(x, y, P.car, 0.52 - v * 0.18 - Math.abs(u - 0.35) * 0.22));

// --- sunlit rear deck, the brightest maroon in frame
quad(CAR.deckY - 6, CAR.panelY - 2, CAR.apNearL - 6, CAR.apNearR + 6, CAR.bodyL + 2, CAR.bodyR - 2,
  (x, y, u, v) => ramp(x, y, P.car, 0.80 - v * 0.26 - u * 0.10));
rect(CAR.bodyL + 4, CAR.deckY - 6, CAR.bodyR - 4, CAR.deckY - 6, P.car[7]);   // catch line

// --- rear panel: lamps, plate recess, trim
quad(CAR.panelY, CAR.bumperY, CAR.bodyL + 2, CAR.bodyR - 2, CAR.bodyL + 6, CAR.bodyR - 6,
  (x, y, u, v) => ramp(x, y, P.car, 0.44 - v * 0.16 - Math.abs(u - 0.3) * 0.14));
function lamp(x0, x1) {
  rect(x0 - 1, CAR.panelY + 3, x1 + 1, CAR.panelY + 15, P.black[1]);
  quad(CAR.panelY + 4, CAR.panelY + 14, x0, x1, x0 + 1, x1 - 1,
    (x, y, u, v) => ramp(x, y, P.red, 0.40 + v * 0.35 + (1 - u) * 0.25));
  rect(x0, CAR.panelY + 4, x1, CAR.panelY + 4, P.red[4]);
  rect(x0, CAR.panelY + 9, x1, CAR.panelY + 9, P.red[0]);
  rect(x0, CAR.panelY + 10, x1 - 6, CAR.panelY + 13, P.chrome[3]);  // reverse lamp
}
lamp(92, 128); lamp(206, 242);
// plate
rect(146, CAR.panelY + 4, 190, CAR.panelY + 16, P.chrome[0]);
rect(147, CAR.panelY + 5, 189, CAR.panelY + 15, P.chrome[4]);
rect(150, CAR.panelY + 8, 186, CAR.panelY + 12, P.chrome[2]);
mul(147, CAR.panelY + 12, 189, CAR.panelY + 15, 0.8);
// trim strip
rect(CAR.bodyL + 8, CAR.panelY + 1, CAR.bodyR - 8, CAR.panelY + 2, P.chrome[3]);
// bumper
quad(CAR.bumperY, CAR.bumperY + 9, CAR.bodyL - 2, CAR.bodyR + 2, CAR.bodyL + 4, CAR.bodyR - 4,
  (x, y, u, v) => ramp(x, y, P.chrome, 0.74 - v * 0.55 - Math.abs(u - 0.4) * 0.18));
rect(CAR.bodyL, CAR.bumperY + 1, CAR.bodyR, CAR.bumperY + 1, P.chrome[5]);
mul(CAR.bodyL - 4, CAR.bumperY + 7, CAR.bodyR + 4, CAR.bumperY + 11, 0.55);

/* --- THE INTERIOR BOX -------------------------------------------------- */
// aperture rim, painted, catching sun on its near and left edges
quad(CAR.apFarY - 3, CAR.apNearY + 3, CAR.apFarL - 4, CAR.apFarR + 4, CAR.apNearL - 4, CAR.apNearR + 4,
  (x, y, u, v) => ramp(x, y, P.car, 0.62 - v * 0.10 + (1 - u) * 0.14));
// the hole
quad(CAR.apFarY, CAR.apNearY, CAR.apFarL, CAR.apFarR, CAR.apNearL, CAR.apNearR,
  () => P.lin[0]);
// far wall of the well
quad(CAR.apFarY, CAR.flrFarY, CAR.apFarL, CAR.apFarR, CAR.flrFarL, CAR.flrFarR,
  (x, y, u, v) => ramp(x, y, P.lin, 0.06 + v * 0.20 + (1 - u) * 0.06));
// side walls
quad(CAR.apFarY, CAR.apNearY, CAR.apFarL, CAR.flrFarL, CAR.apNearL, CAR.flrNearL,
  (x, y, u) => ramp(x, y, P.lin, 0.30 - u * 0.22));
quad(CAR.apFarY, CAR.apNearY, CAR.flrFarR, CAR.apFarR, CAR.flrNearR, CAR.apNearR,
  (x, y, u) => ramp(x, y, P.lin, 0.10 + u * 0.16));
// the floor, lined; darkest at the back, a little sky landing in the middle
quad(CAR.flrFarY, CAR.flrNearY, CAR.flrFarL, CAR.flrFarR, CAR.flrNearL, CAR.flrNearR,
  (x, y, u, v) => ramp(x, y, P.lin, 0.10 + v * 0.30 - Math.abs(u - 0.45) * 0.10 - Math.max(0, v - 0.8) * 0.9));
reseed(555);
quad(CAR.flrFarY, CAR.flrNearY, CAR.flrFarL, CAR.flrFarR, CAR.flrNearL, CAR.flrNearR,
  (x, y) => (rnd() < 0.10 ? P.lin[1] : null));
// occlusion in every seam
for (let k = 0; k < 4; k++) {
  const f = 0.74 + k * 0.06;
  quad(CAR.flrFarY + k, CAR.flrFarY + k, CAR.flrFarL, CAR.flrFarR, CAR.flrFarL, CAR.flrFarR,
    (x, y) => { const c = get(x, y); return [c[0]*f, c[1]*f, c[2]*f]; });
}
mul(CAR.apNearL, CAR.apNearY - 5, CAR.apNearR, CAR.apNearY, 0.72);

/* --- THE LID ----------------------------------------------------------- */
// underside, in shadow, with a pressed inner panel and a warm bounce up top
quad(CAR.lidTopY, CAR.lidBotY, CAR.lidTopL, CAR.lidTopR, CAR.lidBotL, CAR.lidBotR,
  (x, y, u, v) => ramp(x, y, P.car, 0.34 - v * 0.16 + (1 - u) * 0.10));
quad(CAR.lidTopY + 7, CAR.lidBotY - 10, CAR.lidTopL + 12, CAR.lidTopR - 12, CAR.lidBotL + 14, CAR.lidBotR - 14,
  (x, y, u, v) => ramp(x, y, P.car, 0.18 - v * 0.06 + (1 - u) * 0.08));
// age: chips, a dent that catches light wrong, and dirt up from the road
reseed(613);
quad(CAR.lidTopY, CAR.lidBotY, CAR.lidTopL, CAR.lidTopR, CAR.lidBotL, CAR.lidBotR,
  (x, y) => (rnd() < 0.008 ? P.car[rnd() < 0.6 ? 2 : 4] : null));
quad(CAR.deckY - 6, CAR.panelY - 2, CAR.apNearL - 6, CAR.apNearR + 6, CAR.bodyL + 2, CAR.bodyR - 2,
  (x, y) => (rnd() < 0.018 ? P.car[rnd() < 0.5 ? 4 : 6] : null));
for (let x = CAR.bodyL + 6; x < CAR.bodyR - 6; x++)
  for (let y = CAR.bumperY - 6; y < CAR.bumperY; y++)
    if (rnd() < 0.30 - (CAR.bumperY - y) * 0.04) { const c = get(x, y); put(x, y, mix(c, P.conc[2], 0.42)); }
reseed(77);
for (let i = 0; i < 5; i++) {                 // scuffs along the bumper
  const x = CAR.bodyL + 12 + ((rnd() * 150) | 0);
  rect(x, CAR.bumperY + 2, x + 3 + ((rnd() * 6) | 0), CAR.bumperY + 3, P.chrome[1]);
}
// stamped ribs, so the lid is a pressing rather than a plane
for (const ry of [0.34, 0.62]) {
  const y = Math.round(CAR.lidTopY + (CAR.lidBotY - CAR.lidTopY) * ry);
  const l = Math.round(CAR.lidTopL + (CAR.lidBotL - CAR.lidTopL) * ry) + 16;
  const r = Math.round(CAR.lidTopR + (CAR.lidBotR - CAR.lidTopR) * ry) - 16;
  for (let x = l; x <= r; x++) { put(x, y, ramp(x, y, P.car, 0.46)); put(x, y + 1, ramp(x, y + 1, P.car, 0.10)); }
}
// the outer edge of the lid, edge-on into the sun
rect(CAR.lidTopL - 1, CAR.lidTopY - 3, CAR.lidTopR + 1, CAR.lidTopY - 1, P.car[6]);
for (let x = CAR.lidTopL - 1; x <= CAR.lidTopR + 1; x++) put(x, CAR.lidTopY - 3, ramp(x, 0, P.sun, 0.35 - (x - CAR.lidTopL) / 600));
rect(CAR.lidTopL, CAR.lidTopY, CAR.lidTopR, CAR.lidTopY, P.car[5]);
// latch striker on the bottom edge
rect(158, CAR.lidBotY - 7, 178, CAR.lidBotY - 1, P.chrome[1]);
rect(160, CAR.lidBotY - 6, 176, CAR.lidBotY - 3, P.chrome[3]);
rect(164, CAR.lidBotY - 5, 172, CAR.lidBotY - 4, P.black[0]);
// hinge arms, sweeping down into the well
function hinge(xTop, xBot) {
  for (let y = CAR.lidBotY - 2; y < CAR.flrFarY + 6; y++) {
    const t = (y - (CAR.lidBotY - 2)) / (CAR.flrFarY + 6 - (CAR.lidBotY - 2));
    const x = Math.round(xTop + (xBot - xTop) * t + Math.sin(t * 2.2) * 3);
    put(x, y, P.gun[3]); put(x + 1, y, P.gun[5]); put(x + 2, y, P.gun[1]);
  }
}
hinge(112, 122); hinge(220, 210);
mul(CAR.lidBotL, CAR.lidBotY - 2, CAR.lidBotR, CAR.lidBotY + 2, 0.7);

/* ======================================================================
   6. WHAT IS IN THE BOOT

   Painter's order, back to front. Every item gets a dropped shadow first,
   then a body in ramp values, then one highlight on its sun side — which is
   what stops a pile of objects reading as stickers on a floor.
   ====================================================================== */
function drop(x0, y0, x1, y1, soft) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const e = Math.min(x - x0, x1 - x, y - y0, y1 - y);
    if (e < soft && (e / soft) < thr(x, y)) continue;
    const c = get(x, y); put(x, y, [c[0]*0.45, c[1]*0.45, c[2]*0.48]);
  }
}
function slab(x0, y0, x1, y1, cols, lo, hi, hlTop) {
  drop(x0 + 2, y0 + 2, x1 + 3, y1 + 3, 2);
  quad(y0, y1, x0, x1, x0 + 1, x1 + 1, (x, y, u, v) => ramp(x, y, cols, hi - v * (hi - lo) - u * 0.10));
  if (hlTop !== false) rect(x0, y0, x1 - 1, y0, cols[Math.min(cols.length - 1, 5)]);
}

// --- back row: the vest, and a rifle lying against the far wall
(function vest() {
  drop(106, 106, 152, 130, 2);
  quad(104, 128, 106, 148, 104, 150, (x, y, u, v) => ramp(x, y, P.navy, 0.62 - v * 0.30 - u * 0.14));
  rect(108, 104, 146, 105, P.navy[4]);
  rect(112, 102, 120, 106, P.navy[3]);            // shoulder straps, standing proud
  rect(134, 102, 142, 106, P.navy[3]);
  rect(113, 102, 119, 103, P.navy[4]);
  rect(135, 102, 141, 103, P.navy[4]);
  rect(121, 104, 133, 108, P.navy[0]);            // the gap between them
  rect(112, 110, 142, 112, P.navy[1]);            // straps
  rect(112, 119, 142, 121, P.navy[1]);
  rect(124, 106, 130, 128, P.navy[0]);            // centre seam
  rect(126, 106, 128, 128, P.navy[2]);
  put(127, 115, P.chrome[3]);
})();
(function rifle() {
  drop(150, 100, 224, 114, 1);
  quad(100, 108, 152, 222, 150, 220, (x, y, u, v) => ramp(x, y, P.gun, 0.44 - v * 0.22 - u * 0.06));
  rect(152, 100, 220, 100, P.gun[6]);             // top rail catches the sun
  rect(156, 103, 176, 107, P.gun[1]);             // magazine well
  rect(178, 104, 186, 112, P.gun[2]);             // magazine
  rect(196, 101, 214, 106, P.gun[4]);             // handguard
  for (let x = 198; x < 213; x += 3) rect(x, 102, x, 105, P.gun[0]);
  rect(216, 102, 224, 105, P.gun[1]);             // muzzle
})();

// --- middle: a board with a bolt rifle, ammo boxes, a hard case
(function board() {
  slab(112, 116, 210, 132, P.wood, 0.20, 0.62);
  reseed(31);
  for (let x = 114; x < 208; x += 2) if (rnd() < 0.4) rect(x, 118, x, 130, P.wood[1]);
  rect(120, 121, 150, 123, P.wood[5]);            // a stencil, unreadable on purpose
})();
(function boltRifle() {
  drop(118, 112, 206, 126, 1);
  quad(112, 122, 120, 204, 118, 202, (x, y, u, v) => ramp(x, y, P.wood, 0.52 - v * 0.26 - u * 0.08));
  rect(120, 112, 202, 112, P.wood[5]);
  quad(113, 119, 156, 196, 154, 194, (x, y, u, v) => ramp(x, y, P.gun, 0.40 - v * 0.20));
  rect(156, 113, 194, 113, P.gun[5]);
  rect(160, 108, 182, 112, P.gun[2]);             // scope
  rect(161, 109, 181, 110, P.gun[5]);
  rect(126, 116, 134, 124, P.wood[2]);            // butt
})();
(function ammo() {
  slab(128, 124, 152, 138, P.grn, 0.22, 0.58);
  rect(130, 124, 150, 125, P.grn[5]);
  rect(134, 128, 146, 130, P.brass[2]);
  slab(154, 126, 172, 138, P.brass, 0.18, 0.50);
  rect(156, 126, 170, 127, P.brass[4]);
})();
(function hardCase() {
  slab(194, 116, 240, 142, P.plast, 0.24, 0.66);
  rect(196, 116, 238, 117, P.plast[4]);
  rect(196, 127, 238, 129, P.plast[1]);           // seam
  rect(202, 126, 208, 131, P.chrome[3]);          // latches
  rect(226, 126, 232, 131, P.chrome[3]);
  rect(212, 120, 222, 124, P.plast[1]);           // handle recess
})();

// --- front row: SMG, toolbox, a grenade, a shotgun across the near lip
(function smg() {
  drop(98, 128, 148, 144, 1);
  quad(128, 140, 100, 146, 98, 144, (x, y, u, v) => ramp(x, y, P.gun, 0.46 - v * 0.24 - u * 0.08));
  rect(100, 128, 144, 128, P.gun[6]);
  rect(104, 131, 116, 142, P.gun[1]);             // magazine, down
  rect(126, 130, 140, 134, P.gun[3]);
  for (let x = 128; x < 140; x += 3) rect(x, 131, x, 133, P.gun[0]);
})();
(function toolbox() {
  slab(150, 130, 180, 148, P.red, 0.26, 0.72);
  rect(152, 130, 178, 131, P.red[4]);
  rect(150, 138, 180, 139, P.red[0]);
  rect(160, 127, 170, 130, P.chrome[1]);          // handle
  rect(162, 128, 168, 129, P.chrome[3]);
})();
(function grenade() {
  drop(184, 134, 196, 148, 1);
  quad(133, 147, 185, 195, 184, 196, (x, y, u, v) => {
    const d = Math.abs(u - 0.35) + Math.abs(v - 0.5) * 0.5;
    return ramp(x, y, P.grn, 0.70 - d * 0.9);
  });
  rect(187, 132, 193, 134, P.gun[2]);
  rect(188, 130, 192, 132, P.gun[4]);
  for (let y = 136; y < 146; y += 3) rect(185, y, 195, y, P.grn[1]);
})();
(function shotgun() {
  drop(100, 140, 206, 152, 1);
  quad(140, 148, 102, 204, 100, 202, (x, y, u, v) => ramp(x, y, P.gun, 0.38 - v * 0.20 - u * 0.05));
  rect(102, 140, 200, 140, P.gun[5]);
  quad(141, 149, 160, 202, 158, 200, (x, y, u, v) => ramp(x, y, P.wood, 0.46 - v * 0.22));
  rect(160, 141, 198, 141, P.wood[4]);
  rect(104, 142, 130, 146, P.gun[2]);             // pump
  for (let x = 106; x < 128; x += 3) rect(x, 143, x, 145, P.gun[0]);
})();
(function smallCase() {
  slab(206, 140, 238, 152, P.black, 0.30, 0.85);
  rect(208, 140, 236, 140, P.bin[3]);
  rect(216, 144, 228, 146, P.chrome[1]);
})();
// one last occlusion pass: everything sinks into the lining a little
mul(CAR.flrFarL - 6, CAR.flrFarY, CAR.flrFarR + 6, CAR.flrNearY, 0.97);

// a shaft of sun across the pavement, aimed the way the key light points
for (let y = 150; y < H; y++)
  for (let x = 60; x < 250; x++) {
    const along = (x - 60) / 190, down = (y - 150) / 50;
    const inBeam = Math.abs(along - 0.5 + down * 0.35) < 0.34 - down * 0.12;
    if (!inBeam) continue;
    const c = get(x, y);
    if (c[0] + c[1] + c[2] < 190) continue;      // only the ground takes it
    if ((0.5 - Math.abs(along - 0.5)) > thr(x, y) * 0.7)
      put(x, y, mix(c, P.sun[1], 0.16));
  }

/* ======================================================================
   7. THE TWO OF THEM — nearest, darkest, cut by the frame. Rim light on
   the sun side only; everything else is mass.
   ====================================================================== */
function figure(spec) {
  const { cx, top, jk, skn, hairCols, cap, w, lean } = spec;
  const bottom = H - 1;
  const before = img.slice();          // for an exact silhouette, see the rim pass

  contact(cx + 16, bottom - 3, w + 18, 8, 0.52);

  // torso, barely widening — a coat, not a cone
  quad(top + 38, bottom, cx - w, cx + w, cx - w - 6, cx + w + 6, (x, y, u, v) =>
    ramp(x, y, jk, 0.46 - v * 0.18 - Math.abs(u - 0.28) * 0.36));
  // shoulder cap: square corners, full width at the top
  quad(top + 29, top + 40, cx - w + 2, cx + w - 2, cx - w, cx + w, (x, y, u, v) =>
    ramp(x, y, jk, 0.62 - Math.abs(u - 0.28) * 0.40 - v * 0.05));
  // trapezius, in the collar's shadow — this is the line that says "back"
  quad(top + 30, top + 35, cx - 20, cx + 20, cx - 25, cx + 25, (x, y, u, v) =>
    ramp(x, y, jk, 0.26 - Math.abs(u - 0.3) * 0.2 + v * 0.12));
  // arms — the sun-side one a step up, the shadow-side two down, so the
  // silhouette has three planes in it instead of being one slab
  quad(top + 39, bottom, cx - w - 3, cx - w + 13, cx - w - 11, cx - w + 7, (x, y, u, v) =>
    ramp(x, y, jk, 0.66 - v * 0.22 - u * 0.34));
  quad(top + 39, bottom, cx + w - 13, cx + w + 3, cx + w - 7, cx + w + 11, (x, y, u, v) =>
    ramp(x, y, jk, 0.18 - v * 0.08 + u * 0.16));
  // seams where the sleeves meet the body, and one down the back
  for (let y = top + 41; y < bottom; y++) {
    const t = (y - top - 41) / (bottom - top - 41);
    put(Math.round(cx - w + 13 - t * 6), y, jk[0]);
    put(Math.round(cx + w - 13 + t * 6), y, jk[0]);
    const bx = Math.round(cx + lean * 3 + t * lean * 4);
    put(bx, y, ramp(bx, y, jk, 0.12));
    put(bx + 1, y, ramp(bx + 1, y, jk, 0.26));
  }
  // collar, standing proud of the shoulders
  quad(top + 25, top + 32, cx - 15, cx + 15, cx - 19, cx + 19, (x, y, u, v) =>
    ramp(x, y, jk, 0.30 - Math.abs(u - 0.3) * 0.3 + (1 - v) * 0.10));
  // neck, in the collar's shadow
  rect(cx - 6, top + 22, cx + 6, top + 29, ramp(cx, top + 25, skn, 0.28));
  mul(cx - 7, top + 22, cx + 7, top + 28, 0.52);
  // the back of the head
  quad(top, top + 26, cx - 13, cx + 13, cx - 11, cx + 11, (x, y, u, v) =>
    ramp(x, y, skn, 0.44 - Math.abs(u - 0.32) * 0.5 - v * 0.06));
  quad(top - 2, top + (cap ? 25 : 21), cx - 14, cx + 14, cx - 13, cx + 13, (x, y, u, v) =>
    ramp(x, y, hairCols, 0.72 - Math.abs(u - 0.30) * 0.8 - v * 0.22));
  if (spec.locks) {
    reseed(9);
    for (let i = 0; i < 13; i++) {
      const x = cx - 13 + ((i * 7) % 27);
      const len = 14 + ((i * 13) % 20);
      for (let y = top + 12; y < top + 12 + len; y++) {
        const wob = Math.round(Math.sin((y + i * 3) * 0.45) * 1.5);
        put(x + wob, y, ramp(x, y, hairCols, 0.60 - (y - top) / 80));
        put(x + wob + 1, y, hairCols[0]);
      }
    }
  }
  if (cap) {
    quad(top - 4, top + 14, cx - 14, cx + 14, cx - 15, cx + 15, (x, y, u, v) =>
      ramp(x, y, cap, 0.62 - Math.abs(u - 0.28) * 0.60 - v * 0.10));
    rect(cx - 15, top + 14, cx + 15, top + 16, cap[0]);
    for (let x = cx - 14; x <= cx + 3; x++) put(x, top - 4, ramp(x, 0, cap, 0.88));
    mul(cx - 13, top + 17, cx + 13, top + 22, 0.7);       // shadow it throws
  }

  if (spec.hand) {
    const hxo = spec.hand < 0 ? cx - w - 9 : cx + w - 1, hy = bottom - 30;
    drop(hxo + 1, hy + 2, hxo + 10, hy + 13, 1);
    quad(hy, hy + 12, hxo, hxo + 9, hxo + 1, hxo + 8, (x, y, u, v) =>
      ramp(x, y, skn, 0.40 - v * 0.22 - Math.abs(u - 0.3) * 0.28));
    rect(hxo + 1, hy, hxo + 8, hy + 1, ramp(hxo, hy, skn, 0.10));   // cuff shadow
    for (let k = 1; k < 4; k++) put(hxo + 2 + k * 2, hy + 8, ramp(hxo, hy, skn, 0.08));
    if (spec.smoke) {                                  // and something in it
      rect(hxo - 4, hy + 9, hxo + 2, hy + 10, P.conc[6]);
      put(hxo - 5, hy + 9, P.red[4]); put(hxo - 5, hy + 10, P.red[3]);
      for (let i = 0; i < 5; i++) put(hxo - 5 - i, hy + 7 - i * 2, mix(P.conc[5], P.haze[2], 0.5));
    }
  }

  /* --- rim light ------------------------------------------------------
     Which pixels are the figure is answered by comparing against the
     snapshot taken before it was drawn, not by testing brightness: the
     pavement is darker than a lit sleeve, so a luminance test speckles the
     whole silhouette instead of edging it. Sun is upper-left, so only the
     left edge takes it, one pixel wide, falling off down the body. */
  const isFig = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    const i = (y * W + x) * 4;
    return before[i] !== img[i] || before[i+1] !== img[i+1] || before[i+2] !== img[i+2];
  };
  for (let y = top - 4; y < bottom; y++)
    for (let x = cx - w - 16; x < cx + w + 16; x++)
      if (isFig(x, y) && !isFig(x - 1, y)) {
        const t = 0.52 - (y - top) / 300;
        if (t > 0.04) put(x, y, ramp(x, y, P.sun, t));
      }
  // and a little occlusion on the shadow side, so the edge is not a cut-out
  for (let y = top - 2; y < bottom; y++)
    for (let x = cx - w - 16; x < cx + w + 16; x++)
      if (isFig(x, y) && !isFig(x + 1, y)) {
        const c = get(x, y); put(x, y, [c[0]*0.55, c[1]*0.55, c[2]*0.58]);
      }
}

figure({ cx: 44, top: 62, w: 30, lean: -1, jk: P.jkA, skn: P.sknA, hairCols: P.hair,
         locks: true, hand: -1, smoke: true });
figure({ cx: 272, top: 56, w: 32, lean: 1, jk: P.jkB, skn: P.sknB, hairCols: P.hair,
         cap: P.cap, hand: 1 });

/* ======================================================================
   8. GRADE — lift the sunlit middle, sink the corners, warm the highlights.
   One pass, dithered, so it does not turn into a smooth gradient.
   ====================================================================== */
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const dx = (x - 150) / 190, dy = (y - 90) / 130;
  const d = Math.sqrt(dx * dx + dy * dy);
  const vig = 1 - Math.max(0, d - 0.55) * 0.55;
  const c = get(x, y);
  const warm = (c[0] + c[1] + c[2]) / 765;
  put(x, y, [
    c[0] * vig + warm * 10,
    c[1] * vig + warm * 5,
    c[2] * vig - warm * 2,
  ]);
}

/* ------------------------------------------------------------- present --- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const src = document.createElement('canvas');
src.width = W; src.height = H;
src.getContext('2d').putImageData(new ImageData(img, W, H), 0, 0);

function present() {
  const s = Math.max(1, Math.min(Math.floor((window.innerWidth - 32) / W),
                                 Math.floor((window.innerHeight - 60) / H)));
  canvas.width = W * s; canvas.height = H * s;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(src, 0, 0, W, H, 0, 0, W * s, H * s);
}
addEventListener('resize', present);
present();
</script>
</body>
